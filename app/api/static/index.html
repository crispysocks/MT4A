<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        cream: '#FBF8F4',
        warmwhite: '#FFFDF9',
        ink: '#2D2A26',
        muted: '#8C8680',
        border: '#EDE9E3',
        paper: '#F7F4F0',
        student: { DEFAULT: '#7C7EE8', light: '#EEEEFF', dark: '#5A5DC8', bg: '#F5F4FF' },
        employee: { DEFAULT: '#3DB89C', light: '#E6F8F4', dark: '#2A9080', bg: '#F0FAF7' },
        guest: { DEFAULT: '#E8885E', light: '#FEF3ED', dark: '#D06A42', bg: '#FFF5F0' },
      },
      fontFamily: {
        display: ['Newsreader', 'Georgia', 'serif'],
        body: ['Outfit', 'system-ui', '-apple-system', 'sans-serif'],
      },
      boxShadow: {
        soft: '0 2px 8px rgba(45, 42, 38, 0.04), 0 8px 24px rgba(45, 42, 38, 0.06)',
        card: '0 1px 3px rgba(45, 42, 38, 0.03), 0 6px 20px rgba(45, 42, 38, 0.05), 0 20px 50px rgba(45, 42, 38, 0.08)',
      },
      borderRadius: {
        '2xl': '1rem',
        '3xl': '1.5rem',
      }
    }
  }
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: var(--tw-font-body); background: var(--tw-color-cream); color: var(--tw-color-ink); }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #D4CFC9; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #B8B2AB; }

::selection { background: #E8E4DF; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@keyframes shimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseGlow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.1); }
}

.msg-animate { animation: fadeInUp 0.35s cubic-bezier(0.22, 0.61, 0.36, 1); }

.glass {
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.floating { animation: float 4s ease-in-out infinite; }
.pulse-glow { animation: pulseGlow 2.5s ease-in-out infinite; }

.loading-dot {
  width: 5px; height: 5px;
  background: currentColor;
  border-radius: 50%;
  opacity: 0.4;
  animation: loadBounce 1.4s infinite ease-in-out both;
}
.loading-dot:nth-child(1) { animation-delay: -0.32s; }
.loading-dot:nth-child(2) { animation-delay: -0.16s; }
.loading-dot:nth-child(3) { animation-delay: 0s; }
@keyframes loadBounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
  40% { transform: scale(1); opacity: 0.8; }
}

.gradient-text {
  background: linear-gradient(135deg, var(--tw-color-student), var(--tw-color-student-dark));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

input::placeholder, textarea::placeholder { color: #B8B2AB; }
</style>
</head>
<body class="flex flex-col h-full overflow-hidden">

<!-- Top Bar -->
<header id="topbar" class="h-14 flex-shrink-0 flex items-center justify-between px-6 transition-all duration-500 relative z-20">
  <div class="flex items-center gap-3">
    <div class="flex items-center gap-2">
      <div id="logo-orb" class="w-8 h-8 rounded-xl flex items-center justify-center pulse-glow">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 4a2 2 0 0 0 2 2a2 2 0 0 0 -2 2a2 2 0 0 0 -2 -2a2 2 0 0 0 2 -2"/>
        </svg>
      </div>
      <span id="logo-text" class="font-display text-lg tracking-wide"></span>
    </div>
  </div>

  <div class="flex items-center gap-2">
    <button id="notification-btn" onclick="toggleNotifications()" class="relative p-2 rounded-xl transition-all duration-200 hover:scale-105" title="通知">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
      </svg>
      <span id="notification-badge" class="hidden absolute -top-0.5 -right-0.5 flex items-center justify-center w-4 h-4 text-[9px] font-bold text-white rounded-full shadow-sm">0</span>
    </button>
    <button id="logout-btn" onclick="logout()" class="px-4 py-1.5 text-xs font-medium rounded-xl border border-current/20 transition-all duration-200 hover:bg-white/30">
      登出
    </button>
  </div>
</header>

<!-- Notification Popup -->
<div id="notification-popup" class="hidden fixed right-5 top-16 w-80 bg-white/90 backdrop-blur-xl rounded-2xl shadow-card border border-border/50 overflow-hidden z-50">
  <div class="px-5 py-4 border-b border-border/50 flex items-center justify-between">
    <span class="text-sm font-semibold">通知中心</span>
    <button onclick="toggleNotifications()" class="text-muted hover:text-ink transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
  <div id="notification-list" class="overflow-y-auto max-h-80 divide-y divide-border/30">
    <div class="px-5 py-8 text-center text-sm text-muted">暂无通知</div>
  </div>
</div>

<!-- Guest Banner -->
<div id="guest-banner" class="hidden bg-gradient-to-r from-amber-50/80 to-orange-50/80 border-b border-amber-100/50 px-5 py-2 text-center text-sm text-amber-800/80 backdrop-blur-sm">
  游客模式 · <a href="/login" class="font-semibold underline underline-offset-2 hover:opacity-80 transition-opacity">登录</a> 享受完整功能
</div>

<!-- App Container -->
<div id="app" class="flex flex-1 overflow-hidden min-h-0">

  <!-- Main Chat -->
  <main class="flex-1 flex flex-col min-w-0 relative">
    <!-- Background Decoration -->
    <div id="bg-orb-1" class="fixed w-96 h-96 rounded-full blur-3xl opacity-20 pointer-events-none transition-all duration-1000 -z-10"></div>
    <div id="bg-orb-2" class="fixed w-80 h-80 rounded-full blur-3xl opacity-15 pointer-events-none transition-all duration-1000 -z-10"></div>

    <div id="chat" class="flex-1 overflow-y-auto relative flex flex-col px-4 py-4 gap-3">
      <!-- Empty State -->
      <div id="chat-empty" class="absolute inset-0 flex flex-col items-center justify-center text-center px-6 select-none">
        <div class="relative mb-6">
          <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-white to-transparent flex items-center justify-center shadow-soft floating">
            <svg class="w-10 h-10 text-current/40" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
          </div>
          <div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-xl flex items-center justify-center shadow-sm" id="empty-icon-accent"></div>
        </div>
        <h2 class="font-display text-2xl text-ink/70 mb-2">开始新对话</h2>
        <p class="text-sm text-muted max-w-xs">输入消息，AI 助手即刻响应</p>
      </div>
    </div>

    <!-- Input Area -->
    <div id="input-container" class="flex-shrink-0 px-5 py-5 relative z-10">
      <div class="max-w-3xl mx-auto">
        <div id="input-wrapper" class="relative rounded-2xl transition-all duration-300">
          <textarea
            id="input"
            rows="1"
            placeholder="输入您的消息..."
            class="w-full px-5 py-4 pr-14 bg-white/80 backdrop-blur-sm rounded-2xl text-sm resize-none outline-none transition-all duration-300 leading-relaxed"
            style="max-height: 140px;"
          ></textarea>
          <input type="file" id="file-input" accept=".txt,.md,.docx,.xlsx,.xls,.pdf,.pptx" style="display:none" onchange="handleFileUpload(event)"/>
          <button
            id="upload-btn"
            class="absolute right-14 bottom-2 w-10 h-10 flex items-center justify-center rounded-xl transition-all duration-200 hover:scale-105"
            style="background: rgba(255,255,255,0.9);"
          >
            <svg class="w-5 h-5" style="color: #3DB89C" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
            </svg>
          </button>
          <button
            id="send"
            class="absolute right-2 bottom-2 w-10 h-10 flex items-center justify-center rounded-xl text-white transition-all duration-200 hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0 1 21.485 12 59.77 59.77 0 0 1 3.27 20.876L5.999 12zm0 0h7.5"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// ── Theme Config ──
const THEMES = {
  student: {
    bg: 'linear-gradient(135deg, #7C7EE8 0%, #A78BFA 50%, #C4B5FD 100%)',
    accent: '#7C7EE8',
    accentLight: '#EEEEFF',
    accentBg: 'rgba(124, 126, 232, 0.08)',
    sidebarBg: '#F5F4FF',
    sidebarText: '#5A5DC8',
    sidebarHover: '#E8E7FF',
    sidebarActive: '#7C7EE8',
    orbColor: '#7C7EE8',
    inputRing: 'rgba(124, 126, 232, 0.15)',
    logoText: '学生助手',
    userBubbleBg: 'linear-gradient(135deg, #7C7EE8, #A78BFA)',
    userBubbleText: '#FFFFFF',
    aiBubbleBg: 'rgba(255, 255, 255, 0.85)',
    aiBubbleText: '#2D2A26',
  },
  employee: {
    bg: 'linear-gradient(135deg, #3DB89C 0%, #5DD3B3 50%, #8BE7D1 100%)',
    accent: '#3DB89C',
    accentLight: '#E6F8F4',
    accentBg: 'rgba(61, 184, 156, 0.08)',
    sidebarBg: '#F0FAF7',
    sidebarText: '#2A9080',
    sidebarHover: '#E0F5EF',
    sidebarActive: '#3DB89C',
    orbColor: '#3DB89C',
    inputRing: 'rgba(61, 184, 156, 0.15)',
    logoText: '企业助手',
    userBubbleBg: 'linear-gradient(135deg, #3DB89C, #5DD3B3)',
    userBubbleText: '#FFFFFF',
    aiBubbleBg: 'rgba(255, 255, 255, 0.85)',
    aiBubbleText: '#2D2A26',
  },
  guest: {
    bg: 'linear-gradient(135deg, #E8885E 0%, #F0A876 50%, #FAC9A8 100%)',
    accent: '#E8885E',
    accentLight: '#FEF3ED',
    accentBg: 'rgba(232, 136, 94, 0.08)',
    sidebarBg: '#FFF5F0',
    sidebarText: '#D06A42',
    sidebarHover: '#FFEEE8',
    sidebarActive: '#E8885E',
    orbColor: '#E8885E',
    inputRing: 'rgba(232, 136, 94, 0.15)',
    logoText: '客服助手',
    userBubbleBg: 'linear-gradient(135deg, #E8885E, #F0A876)',
    userBubbleText: '#FFFFFF',
    aiBubbleBg: 'rgba(255, 255, 255, 0.85)',
    aiBubbleText: '#2D2A26',
  },
};

const token = localStorage.getItem('token');
const role = localStorage.getItem('role') || 'guest';
const theme = THEMES[role] || THEMES.guest;

// ── Apply Theme ──
function applyTheme() {
  // Topbar
  const topbar = document.getElementById('topbar');
  topbar.style.background = theme.bg;
  topbar.style.color = '#fff';

  // Logo orb
  const orb = document.getElementById('logo-orb');
  orb.style.background = `linear-gradient(135deg, ${theme.orbColor}, ${theme.orbColor}99)`;
  orb.classList.remove('pulse-glow');

  // Logo text
  document.getElementById('logo-text').textContent = theme.logoText;
  document.getElementById('logo-text').style.color = 'rgba(255,255,255,0.95)';

  // Send button
  const sendBtn = document.getElementById('send');
  sendBtn.style.background = theme.accent;
  sendBtn.onmouseenter = () => { sendBtn.style.opacity = '0.9'; };
  sendBtn.onmouseleave = () => { sendBtn.style.opacity = '1'; };

  // Input wrapper
  const inputWrapper = document.getElementById('input-wrapper');
  inputWrapper.style.boxShadow = `0 0 0 2px ${theme.inputRing}`;

  const input = document.getElementById('input');
  input.style.borderColor = 'transparent';
  input.onfocus = () => {
    inputWrapper.style.boxShadow = `0 0 0 2px ${theme.inputRing}, 0 0 0 4px ${theme.accentBg}`;
  };
  input.onblur = () => {
    inputWrapper.style.boxShadow = `0 0 0 2px ${theme.inputRing}`;
  };

  // Notification button
  const notifBtn = document.getElementById('notification-btn');
  notifBtn.style.color = 'rgba(255,255,255,0.9)';

  // Logout button
  const logoutBtn = document.getElementById('logout-btn');
  logoutBtn.style.color = 'rgba(255,255,255,0.9)';
  logoutBtn.style.background = 'rgba(255,255,255,0.15)';

  if (!token) {
    logoutBtn.style.display = 'none';
    document.getElementById('guest-banner').classList.remove('hidden');
  }

  // Background orbs
  const orb1 = document.getElementById('bg-orb-1');
  const orb2 = document.getElementById('bg-orb-2');
  orb1.style.background = theme.accent;
  orb2.style.background = theme.accent;
  orb1.style.left = '60%';
  orb1.style.top = '20%';
  orb2.style.left = '10%';
  orb2.style.bottom = '30%';

  // Empty state icon accent
  const emptyAccent = document.getElementById('empty-icon-accent');
  emptyAccent.style.background = theme.accentLight;
  emptyAccent.innerHTML = `<svg class="w-3 h-3" style="color: ${theme.accent}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>`;
}

applyTheme();

// ── Logout ──
function logout() {
  fetch('/api/auth/logout', { method: 'POST' });
  localStorage.removeItem('token');
  localStorage.removeItem('role');
  window.location.href = '/login';
}

// ── File Upload ──
async function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('file', file);

  try {
    const response = await fetch('/api/upload', {
      method: 'POST',
      headers: token ? { 'Authorization': 'Bearer ' + token } : {},
      body: formData
    });

    if (!response.ok) {
      const err = await response.json();
      alert('文件上传失败: ' + (err.detail || '未知错误'));
      return;
    }

    const data = await response.json();
    uploadedFileContent = data.text;
    uploadedFileName = data.filename;

    const fileTag = document.createElement('div');
    fileTag.id = 'file-tag';
    fileTag.className = 'flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs mb-2';
    fileTag.style.background = 'rgba(61, 184, 156, 0.15)';
    fileTag.style.color = '#3DB89C';
    fileTag.innerHTML = '<span>📎 ' + uploadedFileName + '</span><button onclick="removeFile()" class="ml-1 hover:opacity-70">✕</button>';

    const inputContainer = document.getElementById('input-container');
    inputContainer.insertBefore(fileTag, inputContainer.firstChild);
  } catch (err) {
    alert('文件上传失败: ' + err.message);
  }
}

function removeFile() {
  uploadedFileContent = null;
  uploadedFileName = null;
  const tag = document.getElementById('file-tag');
  if (tag) tag.remove();
  document.getElementById('file-input').value = '';
}

// ── State ──
let currentConversationId = null;
let isStreaming = false;

// ── DOM ──
const chatEl = document.getElementById('chat');
const chatEmpty = document.getElementById('chat-empty');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

// ── Auto-resize textarea ──
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});

// ── Send Message ──
async function send() {
  const message = inputEl.value.trim();
  if (!message && !uploadedFileContent) return;

  let fullMessage = message;
  if (uploadedFileContent) {
    fullMessage = '【客户信息文件: ' + uploadedFileName + '】\n\n' + uploadedFileContent + '\n\n【用户消息】' + message;
  }

  inputEl.value = '';
  inputEl.style.height = 'auto';
  hideEmpty();
  appendMessage('user', message);

  isStreaming = true;
  sendBtn.disabled = true;
  sendBtn.innerHTML = '<span class="loading-dots flex gap-1"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></span>';

  const assistantDiv = appendMessage('assistant', '');
  showLoading(assistantDiv);

  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers,
      body: JSON.stringify({ conversation_id: currentConversationId, message: fullMessage })
    });

    if (!response.ok && response.status === 401) {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = '/login';
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let assistantText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      for (const line of chunk.split('\n')) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (data.type === 'conversation_id') {
              currentConversationId = data.conversation_id;
            } else if (data.type === 'content') {
              hideLoading(assistantDiv);
              assistantText += data.content;
              assistantDiv.textContent = assistantText;
              scrollToBottom();
            } else if (data.type === 'error') {
              hideLoading(assistantDiv);
              assistantDiv.innerHTML = `<span class="text-sm" style="color: #E8885E">${data.content}</span>`;
            }
          } catch (e) {}
        }
      }
    }
  } catch (e) {
    hideLoading(assistantDiv);
    assistantDiv.innerHTML = `<span class="text-sm" style="color: #E8885E">连接中断，请重试</span>`;
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    sendBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0 1 21.485 12 59.77 59.77 0 0 1 3.27 20.876L5.999 12zm0 0h7.5"/></svg>`;
    if (uploadedFileContent) {
      removeFile();
    }
  }
}

// ── Messages ──
function appendMessage(role, text) {
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-animate flex flex-col max-w-[80%] px-5 py-3.5 rounded-2xl text-sm leading-relaxed';

  const label = document.createElement('div');
  label.className = 'text-[11px] font-medium mb-1.5 opacity-50 uppercase tracking-wide';

  const content = document.createElement('div');

  if (role === 'user') {
    wrapper.classList.add('ml-auto');
    wrapper.style.background = theme.userBubbleBg;
    wrapper.style.color = theme.userBubbleText;
    wrapper.style.borderBottomRightRadius = '6px';
    label.textContent = '我';
    wrapper.appendChild(label);
    wrapper.appendChild(content);
  } else {
    wrapper.classList.add('mr-auto');
    wrapper.style.background = theme.aiBubbleBg;
    wrapper.style.color = theme.aiBubbleText;
    wrapper.style.backdropFilter = 'blur(8px)';
    wrapper.style.border = '1px solid rgba(0,0,0,0.05)';
    wrapper.style.borderBottomLeftRadius = '6px';
    wrapper.style.boxShadow = '0 2px 12px rgba(0,0,0,0.04)';
    label.textContent = 'AI 助手';
    wrapper.appendChild(label);
    wrapper.appendChild(content);
  }

  content.textContent = text;
  chatEl.appendChild(wrapper);
  scrollToBottom();
  return content;
}

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ── Loading ──
function showLoading(container) {
  const dots = document.createElement('div');
  dots.className = 'flex gap-1.5 pt-1';
  dots.innerHTML = '<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>';
  container.appendChild(dots);
}

function hideLoading(container) {
  const dots = container.parentElement.querySelector('.flex.gap-1\\.5');
  if (dots) dots.remove();
}

// ── Empty State ──
function hideEmpty() { if (chatEmpty) chatEmpty.style.display = 'none'; }
function showEmpty() { if (chatEmpty) chatEmpty.style.display = 'flex'; }

// ── Events ──
sendBtn.onclick = send;
document.getElementById('upload-btn').onclick = () => document.getElementById('file-input').click();
inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
});

// ── Notifications ──
async function fetchNotifications() {
  if (!token) return;
  try {
    const resp = await fetch('/api/notifications?status=active', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!resp.ok) return;
    const data = await resp.json();
    renderNotifications(data.notifications || []);
  } catch (e) { console.error('Notifications:', e); }
}

function renderNotifications(notifications) {
  const badge = document.getElementById('notification-badge');
  const list = document.getElementById('notification-list');

  if (notifications.length === 0) {
    badge.classList.add('hidden');
    list.innerHTML = '<div class="px-5 py-8 text-center text-sm" style="color: ' + theme.muted + '">暂无通知</div>';
    return;
  }

  badge.classList.remove('hidden');
  badge.textContent = notifications.length;

  list.innerHTML = notifications.map(n => {
    const typeLabels = {
      leave_request: '请假申请',
      leave_result: '请假结果',
      complaint: '投诉',
      complaint_result: '投诉结果',
      exam_reminder: '考试提醒',
      psychology_warning: '心理预警',
      progress_update: '进度更新',
      todo_reminder: '待办提醒',
    };
    const label = typeLabels[n.notification_type] || n.notification_type;
    const time = n.created_at ? new Date(n.created_at).toLocaleString('zh-CN') : '';

    return `<div class="px-5 py-4 hover:bg-black/5 cursor-pointer transition-all" onclick="dismissNotification(${n.id})">
      <div class="text-sm" style="color: ${theme.ink}">${n.content_summary}</div>
      <div class="flex items-center justify-between mt-1.5">
        <span class="text-xs font-medium px-2 py-0.5 rounded-md" style="background: ${theme.accentLight}; color: ${theme.accent}">${label}</span>
        <span class="text-xs" style="color: ${theme.muted}">${time}</span>
      </div>
    </div>`;
  }).join('');
}

async function dismissNotification(id) {
  try {
    await fetch(`/api/notifications/${id}/action`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ operation_type: 'read' })
    });
    fetchNotifications();
  } catch (e) { console.error('Dismiss:', e); }
}

function toggleNotifications() {
  const popup = document.getElementById('notification-popup');
  popup.classList.toggle('hidden');
  if (!popup.classList.contains('hidden')) {
    fetchNotifications();
  }
}

document.addEventListener('click', (e) => {
  const popup = document.getElementById('notification-popup');
  const btn = document.getElementById('notification-btn');
  if (popup && btn && !popup.classList.contains('hidden') &&
      !popup.contains(e.target) && !btn.contains(e.target)) {
    popup.classList.add('hidden');
  }
});

// ── Init ──
fetchNotifications();
</script>
<script src="/static/app.js"></script>
</body>
</html>
