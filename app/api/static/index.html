<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        surface: '#FAFAF9',
        ink: '#1C1C1E',
        muted: '#78716C',
        border: '#E8E6E1',
        paper: '#F5F5F4',
        student: { DEFAULT: '#3B82F6', light: '#EFF6FF', dark: '#1D4ED8' },
        employee: { DEFAULT: '#10B981', light: '#ECFDF5', dark: '#059669' },
        guest: { DEFAULT: '#6B7280', light: '#F3F4F6', dark: '#4B5563' },
      },
      fontFamily: {
        display: ['Georgia', 'Noto Serif SC', 'serif'],
        body: ['Segoe UI', 'system-ui', '-apple-system', 'sans-serif'],
      },
      boxShadow: {
        msg: '0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.05)',
        card: '0 1px 3px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.06)',
      }
    }
  }
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: var(--tw-font-body); background: var(--tw-color-surface); color: var(--tw-color-ink); }
::selection { background: #E8EAED; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #D6D3D1; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #A8A29E; }

@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg-animate { animation: msgIn 0.3s cubic-bezier(0.22, 0.61, 0.36, 1); }

@keyframes dotPulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.2); }
}
.animate-pulse-slow { animation: dotPulse 2s ease-in-out infinite; }

.loading-dot {
  width: 6px; height: 6px;
  background: #9CA3AF;
  border-radius: 50%;
  animation: loadBounce 1.4s infinite ease-in-out both;
}
.loading-dot:nth-child(1) { animation-delay: -0.32s; }
.loading-dot:nth-child(2) { animation-delay: -0.16s; }
@keyframes loadBounce {
  0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body class="flex flex-col h-full overflow-hidden">

<!-- Topbar -->
<header id="topbar" class="h-12 flex items-center justify-between px-5 flex-shrink-0 border-b transition-all duration-300">
  <div class="flex items-center gap-3">
    <div id="logo-dot" class="w-2 h-2 rounded-full animate-pulse-slow"></div>
    <span id="logo-text" class="font-display text-base tracking-wide"></span>
  </div>
  <button id="logout-btn" onclick="logout()" class="px-4 py-1.5 text-xs font-medium rounded-full border transition-all duration-200 hover:opacity-80">登出</button>
</header>

<!-- Guest Banner -->
<div id="guest-banner" class="hidden bg-amber-50 border-b border-amber-100 px-5 py-2 text-center text-sm text-amber-800">
  游客模式 · <a href="/login" class="font-semibold underline underline-offset-2 hover:opacity-80">登录</a> 享受更多功能
</div>

<!-- App Container -->
<div id="app" class="flex flex-1 overflow-hidden min-h-0">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-64 flex-shrink-0 flex flex-col border-r transition-all duration-300">
    <div id="sidebar-header" class="px-4 py-4 border-b flex items-center justify-between"></div>

    <button id="new-chat-btn" class="mx-3 mt-3 mb-2 px-3 py-2.5 text-sm font-medium rounded-lg border transition-all duration-200 flex items-center gap-2 hover:opacity-90">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
      </svg>
      新建对话
    </button>

    <div id="session-list" class="flex-1 overflow-y-auto px-2 pb-3 flex flex-col gap-0.5"></div>
  </aside>

  <!-- Main Chat Area -->
  <main class="flex-1 flex flex-col min-w-0">
    <div id="chat" class="flex-1 overflow-y-auto">
      <!-- Empty State -->
      <div id="chat-empty" class="h-full flex flex-col items-center justify-center text-muted select-none">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-stone-100 to-stone-200 flex items-center justify-center mb-4 shadow-sm">
          <svg class="w-7 h-7 text-stone-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v4m0 12v4M2 12h4m12 0h4"/>
            <circle cx="12" cy="12" r="8" stroke-opacity="0.4"/>
          </svg>
        </div>
        <h2 class="font-display text-xl text-stone-500 mb-1">开始新对话</h2>
        <p class="text-sm text-stone-400">输入消息，AI 助手即刻响应</p>
      </div>
    </div>

    <!-- Input Area -->
    <div id="input-container" class="flex-shrink-0 px-6 py-4 border-t bg-surface">
      <div class="max-w-3xl mx-auto flex gap-3 items-end">
        <textarea
          id="input"
          rows="1"
          placeholder="输入您的消息..."
          class="flex-1 px-4 py-3 bg-white border border-border rounded-xl text-sm resize-none outline-none transition-all duration-200 focus:ring-2 focus:ring-offset-1 leading-relaxed"
          style="max-height: 120px;"
        ></textarea>
        <button
          id="send"
          class="px-5 py-3 text-sm font-semibold text-white rounded-xl transition-all duration-200 flex-shrink-0 flex items-center gap-2 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span>发送</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>
  </main>
</div>

<script>
// ── Theme Config ──
const THEMES = {
  student: {
    bg: 'linear-gradient(135deg, #3B82F6, #60A5FA)',
    accent: '#3B82F6',
    accentLight: '#EFF6FF',
    sidebarBg: '#1E3A5F',
    sidebarText: '#BFDBFE',
    sidebarHover: '#2563EB',
    sidebarActive: '#1D4ED8',
    logoText: '学生助手',
    inputRing: 'rgba(59, 130, 246, 0.15)',
    sendBg: '#3B82F6',
    sendHover: '#2563EB',
    userBubbleBg: '#EFF6FF',
    userBubbleText: '#1E40AF',
  },
  employee: {
    bg: 'linear-gradient(135deg, #10B981, #34D399)',
    accent: '#10B981',
    accentLight: '#ECFDF5',
    sidebarBg: '#064E3B',
    sidebarText: '#A7F3D0',
    sidebarHover: '#047857',
    sidebarActive: '#059669',
    logoText: '企业助手',
    inputRing: 'rgba(16, 185, 129, 0.15)',
    sendBg: '#10B981',
    sendHover: '#059669',
    userBubbleBg: '#ECFDF5',
    userBubbleText: '#065F46',
  },
  guest: {
    bg: 'linear-gradient(135deg, #6B7280, #9CA3AF)',
    accent: '#6B7280',
    accentLight: '#F3F4F6',
    sidebarBg: '#1F2937',
    sidebarText: '#D1D5DB',
    sidebarHover: '#374151',
    sidebarActive: '#4B5563',
    logoText: '客服助手',
    inputRing: 'rgba(107, 114, 128, 0.15)',
    sendBg: '#6B7280',
    sendHover: '#4B5563',
    userBubbleBg: '#F3F4F6',
    userBubbleText: '#374151',
  },
};

const token = localStorage.getItem('token');
const role = localStorage.getItem('role') || 'guest';
const theme = THEMES[role] || THEMES.guest;

// ── Apply Theme ──
function applyTheme() {
  const topbar = document.getElementById('topbar');
  topbar.style.background = theme.bg;
  topbar.style.color = '#fff';

  const sidebar = document.getElementById('sidebar');
  sidebar.style.background = theme.sidebarBg;

  document.getElementById('logo-dot').style.background = 'rgba(255,255,255,0.8)';
  document.getElementById('logo-text').textContent = theme.logoText;
  document.getElementById('logo-text').style.color = 'rgba(255,255,255,0.95)';

  const logoutBtn = document.getElementById('logout-btn');
  logoutBtn.style.background = 'rgba(255,255,255,0.15)';
  logoutBtn.style.color = 'rgba(255,255,255,0.9)';
  logoutBtn.style.borderColor = 'rgba(255,255,255,0.25)';

  const newChatBtn = document.getElementById('new-chat-btn');
  newChatBtn.style.background = 'rgba(255,255,255,0.1)';
  newChatBtn.style.color = theme.sidebarText;
  newChatBtn.style.borderColor = 'rgba(255,255,255,0.15)';
  newChatBtn.onmouseenter = () => { newChatBtn.style.background = 'rgba(255,255,255,0.15)'; };
  newChatBtn.onmouseleave = () => { newChatBtn.style.background = 'rgba(255,255,255,0.1)'; };

  const sendBtn = document.getElementById('send');
  sendBtn.style.background = theme.sendBg;
  sendBtn.onmouseenter = () => { sendBtn.style.background = theme.sendHover; };
  sendBtn.onmouseleave = () => { sendBtn.style.background = theme.sendBg; };

  const input = document.getElementById('input');
  input.style.borderColor = theme.border;
  input.style.boxShadow = `0 0 0 3px ${theme.inputRing}`;
  input.onfocus = () => {
    input.style.borderColor = theme.accent;
    input.style.boxShadow = `0 0 0 3px ${theme.inputRing}, 0 0 0 1px ${theme.accent}30`;
  };
  input.onblur = () => {
    input.style.borderColor = theme.border;
    input.style.boxShadow = `0 0 0 3px ${theme.inputRing}`;
  };

  if (!token) {
    document.getElementById('logout-btn').style.display = 'none';
    document.getElementById('guest-banner').classList.remove('hidden');
  }
}

applyTheme();

// ── Logout ──
function logout() {
  fetch('/api/auth/logout', { method: 'POST' });
  localStorage.removeItem('token');
  localStorage.removeItem('role');
  window.location.href = '/login';
}

// ── State ──
let currentConversationId = null;
let isStreaming = false;

// ── DOM ──
const chatEl = document.getElementById('chat');
const chatEmpty = document.getElementById('chat-empty');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const sessionListEl = document.getElementById('session-list');
const newChatBtn = document.getElementById('new-chat-btn');

// ── Auto-resize textarea ──
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// ── Send Message ──
async function send() {
  const message = inputEl.value.trim();
  if (!message || isStreaming) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  hideEmpty();
  appendMessage('user', message);

  isStreaming = true;
  sendBtn.disabled = true;
  sendBtn.innerHTML = '<span class="loading-dots flex gap-1"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></span>';

  const assistantDiv = appendMessage('assistant', '');
  showLoading(assistantDiv);

  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers,
      body: JSON.stringify({ conversation_id: currentConversationId, message })
    });

    if (!response.ok && response.status === 401) {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = '/login';
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let assistantText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      for (const line of chunk.split('\n')) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (data.type === 'conversation_id') {
              currentConversationId = data.conversation_id;
            } else if (data.type === 'content') {
              hideLoading(assistantDiv);
              assistantText += data.content;
              assistantDiv.textContent = assistantText;
              scrollToBottom();
            } else if (data.type === 'error') {
              hideLoading(assistantDiv);
              assistantDiv.innerHTML = `<span class="text-red-500 text-sm">${data.content}</span>`;
            }
          } catch (e) {}
        }
      }
    }
  } catch (e) {
    hideLoading(assistantDiv);
    assistantDiv.innerHTML = `<span class="text-red-500 text-sm">连接中断，请重试</span>`;
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    sendBtn.innerHTML = `<span>发送</span>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
      </svg>`;
    loadSessions();
  }
}

// ── Messages ──
function appendMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg-animate max-w-[75%] px-4 py-3 rounded-2xl text-sm leading-relaxed';

  if (role === 'user') {
    div.classList.add('self-end');
    div.style.background = theme.userBubbleBg;
    div.style.color = theme.userBubbleText;
    div.style.borderBottomRightRadius = '4px';
  } else {
    div.classList.add('self-start');
    div.style.background = '#fff';
    div.style.color = theme.userBubbleText;
    div.style.border = `1px solid ${theme.border}`;
    div.style.boxShadow = 'var(--tw-shadow-msg)';
    div.style.borderBottomLeftRadius = '4px';
  }

  const label = role === 'user' ? '我' : 'AI 助手';
  div.innerHTML = `<div class="text-xs font-medium mb-1 opacity-50 uppercase tracking-wide">${label}</div>`;
  const contentSpan = document.createElement('span');
  contentSpan.textContent = text;
  div.appendChild(contentSpan);
  chatEl.appendChild(div);
  scrollToBottom();
  return contentSpan;
}

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ── Loading ──
function showLoading(container) {
  const dots = document.createElement('div');
  dots.className = 'flex gap-1.5 pt-1';
  dots.innerHTML = '<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>';
  container.appendChild(dots);
}

function hideLoading(container) {
  const dots = container.parentElement.querySelector('.flex.gap-1\\.5');
  if (dots) dots.remove();
}

// ── Empty State ──
function hideEmpty() { if (chatEmpty) chatEmpty.style.display = 'none'; }
function showEmpty() { if (chatEmpty) chatEmpty.style.display = 'flex'; }

// ── Sessions ──
async function loadSessions() {
  try {
    const headers = {};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const resp = await fetch('/api/sessions', { headers });
    const sessions = await resp.json();
    sessionListEl.innerHTML = '';

    if (!Array.isArray(sessions) || sessions.length === 0) {
      sessionListEl.innerHTML = '<div class="text-center text-xs text-stone-500 py-6 opacity-50 italic">暂无对话记录</div>';
      return;
    }

    sessions.forEach(s => {
      const div = document.createElement('div');
      div.className = 'session-item px-3 py-2.5 rounded-lg text-sm cursor-pointer transition-all duration-150 truncate';
      div.style.color = theme.sidebarText;

      if (s.id === currentConversationId) {
        div.style.background = theme.sidebarActive;
        div.style.color = '#fff';
      }

      const date = s.updated_at ? new Date(s.updated_at).toLocaleDateString('zh-CN') : '';
      div.textContent = date ? `${date} · ${s.id.slice(0, 6)}` : `对话 ${s.id.slice(0, 8)}`;
      div.title = `ID: ${s.id}`;

      div.onmouseenter = () => {
        if (s.id !== currentConversationId) {
          div.style.background = theme.sidebarHover;
        }
      };
      div.onmouseleave = () => {
        if (s.id !== currentConversationId) {
          div.style.background = 'transparent';
        }
      };

      div.onclick = () => loadSession(s.id);
      sessionListEl.appendChild(div);
    });
  } catch (e) { console.error('Sessions:', e); }
}

async function loadSession(id) {
  if (isStreaming) return;
  currentConversationId = id;
  chatEl.innerHTML = '<div class="h-full flex items-center justify-center text-stone-400"><span class="text-sm">加载中...</span></div>';
  try {
    const headers = {};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const resp = await fetch(`/api/sessions/${id}`, { headers });
    const session = await resp.json();
    chatEl.innerHTML = '';
    if (session.messages && session.messages.length > 0) {
      session.messages.forEach(msg => {
        let content = typeof msg.content === 'string'
          ? msg.content
          : (Array.isArray(msg.content)
            ? msg.content.map(b => b.text || '').join('').slice(0, 500)
            : String(msg.content));
        appendMessage(msg.role, content);
      });
    } else {
      chatEl.innerHTML = '';
    }
  } catch (e) {
    console.error('Load session:', e);
    chatEl.innerHTML = '';
  }
  loadSessions();
}

// ── New Chat ──
newChatBtn.onclick = () => {
  if (isStreaming) return;
  currentConversationId = null;
  chatEl.innerHTML = '';
  showEmpty();
  loadSessions();
};

// ── Events ──
sendBtn.onclick = send;
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// ── Init ──
loadSessions();
</script>
</body>
</html>
