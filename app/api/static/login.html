<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — AI 助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        surface: '#FAFAF9',
        ink: '#1C1C1E',
        muted: '#78716C',
        border: '#E8E6E1',
        paper: '#F5F5F4',
        student: { DEFAULT: '#3B82F6', light: '#EFF6FF', dark: '#1D4ED8' },
        employee: { DEFAULT: '#10B981', light: '#ECFDF5', dark: '#059669' },
        guest: { DEFAULT: '#6B7280', light: '#F3F4F6', dark: '#4B5563' },
      },
      fontFamily: {
        display: ['Georgia', 'Noto Serif SC', 'serif'],
        body: ['Segoe UI', 'system-ui', '-apple-system', 'sans-serif'],
      },
      boxShadow: {
        card: '0 1px 3px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.06), 0 16px 48px rgba(0,0,0,0.06)',
      }
    }
  }
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--tw-font-body);
  background: var(--tw-color-surface);
  min-height: 100vh;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.card-animate { animation: cardIn 0.5s cubic-bezier(0.22, 0.61, 0.36, 1); }

@keyframes msgIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg-show { animation: msgIn 0.25s ease; }
</style>
</head>
<body class="flex items-center justify-center p-5">

<div class="w-full max-w-sm">
  <!-- Logo -->
  <div class="text-center mb-8">
    <div id="logo-icon" class="w-12 h-12 rounded-xl mx-auto mb-4 flex items-center justify-center shadow-md">
      <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v4m0 12v4M2 12h4m12 0h4"/>
        <circle cx="12" cy="12" r="8" stroke-opacity="0.4"/>
      </svg>
    </div>
    <h1 class="font-display text-2xl text-ink tracking-tight">AI 助手</h1>
    <p class="text-muted text-sm mt-1 tracking-wide">Intelligent Assistant</p>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-2xl border border-border shadow-card p-8 card-animate">
    <!-- Tabs -->
    <div class="flex border-b border-border mb-6">
      <button id="tab-login" class="tab-btn flex-1 pb-3 text-sm font-medium text-center border-b-2 transition-all duration-200 text-student" onclick="switchTab('login')">登录</button>
      <button id="tab-register" class="tab-btn flex-1 pb-3 text-sm font-medium text-center border-b-2 transition-all duration-200 text-muted border-transparent" onclick="switchTab('register')">注册</button>
    </div>

    <!-- Messages -->
    <div id="error" class="hidden mb-4 px-4 py-3 rounded-lg text-sm text-red-600 bg-red-50 msg-show"></div>
    <div id="success" class="hidden mb-4 px-4 py-3 rounded-lg text-sm text-employee bg-employee-light msg-show"></div>

    <!-- Login Form -->
    <form id="loginForm" autocomplete="off">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2">用户名</label>
          <input type="text" id="loginUser" placeholder="输入用户名" required
            class="w-full px-4 py-3 bg-paper border border-border rounded-xl text-sm text-ink placeholder-muted/60 outline-none transition-all duration-200 focus:border-student focus:ring-2 focus:ring-student/10">
        </div>
        <div>
          <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2">密码</label>
          <input type="password" id="loginPass" placeholder="输入密码" required
            class="w-full px-4 py-3 bg-paper border border-border rounded-xl text-sm text-ink placeholder-muted/60 outline-none transition-all duration-200 focus:border-student focus:ring-2 focus:ring-student/10">
        </div>
      </div>
      <button type="submit" id="loginBtn" class="w-full mt-6 py-3 bg-student text-white text-sm font-semibold rounded-xl transition-all duration-200 hover:bg-student-dark hover:shadow-lg active:scale-[0.98]">
        登 录
      </button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="hidden" autocomplete="off">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2">用户名</label>
          <input type="text" id="regUser" placeholder="至少 2 个字符" required minlength="2"
            class="w-full px-4 py-3 bg-paper border border-border rounded-xl text-sm text-ink placeholder-muted/60 outline-none transition-all duration-200 focus:border-student focus:ring-2 focus:ring-student/10">
        </div>
        <div>
          <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2">密码</label>
          <input type="password" id="regPass" placeholder="至少 4 个字符" required minlength="4"
            class="w-full px-4 py-3 bg-paper border border-border rounded-xl text-sm text-ink placeholder-muted/60 outline-none transition-all duration-200 focus:border-student focus:ring-2 focus:ring-student/10">
        </div>
        <div>
          <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2">身份</label>
          <select id="regRole" onchange="toggleAdvisorField()"
            class="w-full px-4 py-3 bg-paper border border-border rounded-xl text-sm text-ink outline-none transition-all duration-200 focus:border-student focus:ring-2 focus:ring-student/10 appearance-none cursor-pointer"
            style="background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2378716C%22 stroke-width=%222%22><path d=%22M6 9l6 6 6-6%22/></svg>'); background-repeat: no-repeat; background-position: right 14px center;">
            <option value="student">学生</option>
            <option value="employee">员工 / 老师</option>
          </select>
        </div>
        <div id="advisorField" class="hidden space-y-1">
          <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2">班主任</label>
          <select id="regAdvisor"
            class="w-full px-4 py-3 bg-paper border border-border rounded-xl text-sm text-ink outline-none transition-all duration-200 focus:border-student focus:ring-2 focus:ring-student/10 appearance-none cursor-pointer"
            style="background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2378716C%22 stroke-width=%222%22><path d=%22M6 9l6 6 6-6%22/></svg>'); background-repeat: no-repeat; background-position: right 14px center;">
            <option value="">请选择班主任</option>
          </select>
        </div>
      </div>
      <button type="submit" id="registerBtn" class="w-full mt-6 py-3 bg-student text-white text-sm font-semibold rounded-xl transition-all duration-200 hover:bg-student-dark hover:shadow-lg active:scale-[0.98]">
        注 册
      </button>
    </form>

    <!-- Guest Link -->
    <div class="mt-6 pt-5 border-t border-border text-center">
      <a href="/" class="text-sm text-muted hover:text-student transition-colors duration-200">
        免登录体验游客模式 →
      </a>
    </div>
  </div>
</div>

<script>
const THEMES = {
  student: { bg: 'linear-gradient(135deg, #3B82F6, #60A5FA)', color: '#3B82F6' },
  employee: { bg: 'linear-gradient(135deg, #10B981, #34D399)', color: '#10B981' },
  guest: { bg: 'linear-gradient(135deg, #6B7280, #9CA3AF)', color: '#6B7280' },
};

const role = localStorage.getItem('role') || 'student';
const theme = THEMES[role] || THEMES.student;

document.getElementById('logo-icon').style.background = theme.bg;
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onmouseenter = () => {
    if (!btn.classList.contains('text-student') && !btn.classList.contains('border-student')) {
      btn.style.color = theme.color;
    }
  };
  btn.onmouseleave = () => {
    if (!btn.classList.contains('border-student')) {
      btn.style.color = '';
    }
  };
});

let currentTab = 'login';
let employees = [];

async function loadEmployees() {
  try {
    const resp = await fetch('/api/employees');
    const data = await resp.json();
    employees = data.employees || [];
    populateAdvisorDropdown();
  } catch (e) {
    console.error('Failed to load employees', e);
  }
}

function populateAdvisorDropdown() {
  const select = document.getElementById('regAdvisor');
  if (!select) return;
  select.innerHTML = '<option value="">请选择班主任</option>';
  employees.forEach(emp => {
    const opt = document.createElement('option');
    opt.value = emp.id;
    opt.textContent = emp.username;
    select.appendChild(opt);
  });
}

function toggleAdvisorField() {
  const role = document.getElementById('regRole')?.value;
  const advisorField = document.getElementById('advisorField');
  if (!advisorField) return;
  if (role === 'student') {
    advisorField.classList.remove('hidden');
    advisorField.classList.add('block');
  } else {
    advisorField.classList.add('hidden');
    advisorField.classList.remove('block');
    const select = document.getElementById('regAdvisor');
    if (select) select.value = '';
  }
}

function switchTab(tab) {
  currentTab = tab;
  const loginTab = document.getElementById('tab-login');
  const registerTab = document.getElementById('tab-register');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');

  loginTab.classList.toggle('text-student', tab === 'login');
  loginTab.classList.toggle('border-student', tab === 'login');
  loginTab.classList.toggle('border-transparent', tab !== 'login');
  loginTab.classList.toggle('text-muted', tab !== 'login');

  registerTab.classList.toggle('text-student', tab === 'register');
  registerTab.classList.toggle('border-student', tab === 'register');
  registerTab.classList.toggle('border-transparent', tab !== 'register');
  registerTab.classList.toggle('text-muted', tab !== 'register');

  loginForm.classList.toggle('hidden', tab !== 'login');
  registerForm.classList.toggle('hidden', tab !== 'register');
  hideMessages();
  if (tab === 'register') {
    loadEmployees();
  }
}

function showErr(msg) {
  const e = document.getElementById('error');
  e.textContent = msg;
  e.classList.remove('hidden');
  document.getElementById('success').classList.add('hidden');
}

function showOk(msg) {
  const s = document.getElementById('success');
  s.textContent = msg;
  s.classList.remove('hidden');
  document.getElementById('error').classList.add('hidden');
}

function hideMessages() {
  document.getElementById('error').classList.add('hidden');
  document.getElementById('success').classList.add('hidden');
}

document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  hideMessages();
  const btn = document.getElementById('loginBtn');
  btn.textContent = '登录中...';
  btn.disabled = true;
  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('loginUser').value,
        password: document.getElementById('loginPass').value
      })
    });
    const data = await resp.json();
    if (!resp.ok) {
      showErr(data.detail || '登录失败');
      btn.textContent = '登录';
      btn.disabled = false;
      return;
    }
    localStorage.setItem('token', data.token);
    localStorage.setItem('role', data.role);
    window.location.href = '/';
  } catch {
    showErr('网络错误，请重试');
    btn.textContent = '登录';
    btn.disabled = false;
  }
};

document.getElementById('registerForm').onsubmit = async (e) => {
  e.preventDefault();
  hideMessages();
  const btn = document.getElementById('registerBtn');
  btn.textContent = '注册中...';
  btn.disabled = true;
  try {
    const regBody = {
      username: document.getElementById('regUser').value,
      password: document.getElementById('regPass').value,
      role: document.getElementById('regRole').value
    };
    if (regBody.role === 'student') {
      const advisorVal = document.getElementById('regAdvisor')?.value;
      if (advisorVal) {
        regBody.class_advisor_id = parseInt(advisorVal);
      }
    }
    const resp = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(regBody)
    });
    const data = await resp.json();
    if (!resp.ok) {
      showErr(data.detail || '注册失败');
      btn.textContent = '注册';
      btn.disabled = false;
      return;
    }
    showOk('注册成功！请切换到登录页面');
    document.getElementById('regUser').value = '';
    document.getElementById('regPass').value = '';
    btn.textContent = '注册';
    btn.disabled = false;
  } catch {
    showErr('网络错误，请重试');
    btn.textContent = '注册';
    btn.disabled = false;
  }
};
</script>
</body>
</html>
