# 角色可访问的数据库表配置
employee:
  users:
    fields:
      class_advisor_id: read, write
  tables:
  - leads
  - lead_follow_ups
  - daily_reports
  - complaints
  - organization
  - student_grades
  - leave_requests
  - exam_schedule
  - psychology_profiles
  - psychology_warnings
  - courses
  - events
  - registrations

student:
  users:
    fields:
      class_advisor_id: read
  tables:
  - student_grades
  - leave_requests
  - exam_schedule
  - psychology_profiles
  - psychology_warnings
  - complaints
  - courses
  - events
  - registrations

guest:
  - users
  - courses
  - events
  - registrations