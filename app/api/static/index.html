<!DOCTYPE html>
<html>
<head>
    <title>mt4a Agent</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; }
        #sidebar { width: 250px; background: #f5f5f5; padding: 10px; overflow-y: auto; border-right: 1px solid #ddd; }
        #sidebar h3 { margin: 0 0 10px 0; font-size: 16px; }
        #sidebar .session-item { padding: 8px; cursor: pointer; border-radius: 4px; margin: 4px 0; }
        #sidebar .session-item:hover { background: #e0e0e0; }
        #sidebar .session-item.active { background: #d0d0ff; }
        #sidebar button { width: 100%; padding: 8px; margin-top: 10px; cursor: pointer; }
        #main { flex: 1; display: flex; flex-direction: column; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; }
        .message { margin: 10px 0; padding: 10px; border-radius: 8px; }
        .message.user { background: #e3f2fd; }
        .message.assistant { background: #f5f5f5; }
        #input-container { display: flex; padding: 10px; border-top: 1px solid #ddd; }
        #input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        #send { padding: 10px 20px; margin-left: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="sidebar"></div>
    <div id="main">
        <div id="chat"></div>
        <div id="input-container">
            <input id="input" type="text" placeholder="Type a message..." />
            <button id="send" onclick="send()">Send</button>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
