<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — AI 助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        cream: '#FBF8F4',
        warmwhite: '#FFFDF9',
        ink: '#2D2A26',
        muted: '#8C8680',
        border: '#EDE9E3',
        paper: '#F7F4F0',
        student: { DEFAULT: '#7C7EE8', light: '#EEEEFF', dark: '#5A5DC8', bg: '#F5F4FF' },
        employee: { DEFAULT: '#3DB89C', light: '#E6F8F4', dark: '#2A9080', bg: '#F0FAF7' },
        guest: { DEFAULT: '#E8885E', light: '#FEF3ED', dark: '#D06A42', bg: '#FFF5F0' },
      },
      fontFamily: {
        display: ['Newsreader', 'Georgia', 'serif'],
        body: ['Outfit', 'system-ui', '-apple-system', 'sans-serif'],
      },
      boxShadow: {
        soft: '0 2px 8px rgba(45, 42, 38, 0.04), 0 8px 24px rgba(45, 42, 38, 0.06)',
        card: '0 1px 3px rgba(45, 42, 38, 0.03), 0 6px 20px rgba(45, 42, 38, 0.05), 0 20px 50px rgba(45, 42, 38, 0.08)',
      },
      borderRadius: {
        '2xl': '1rem',
        '3xl': '1.5rem',
      }
    }
  }
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--tw-font-body);
  background: var(--tw-color-cream);
  min-height: 100vh;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #D4CFC9; border-radius: 6px; }

::selection { background: #E8E4DF; }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.card-animate { animation: cardIn 0.45s cubic-bezier(0.22, 0.61, 0.36, 1); }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeIn 0.25s ease; }

input::placeholder, textarea::placeholder { color: #C4BEB8; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-5 relative overflow-hidden">

<!-- Background Orbs -->
<div class="fixed w-96 h-96 rounded-full blur-3xl opacity-20 pointer-events-none -z-10" style="background: #7C7EE8; right: -10%; top: -20%;"></div>
<div class="fixed w-80 h-80 rounded-full blur-3xl opacity-15 pointer-events-none -z-10" style="background: #3DB89C; left: -5%; bottom: -20%;"></div>

<div class="w-full max-w-sm relative z-10">
  <!-- Logo -->
  <div class="text-center mb-10">
    <div id="logo-icon" class="w-14 h-14 rounded-2xl mx-auto mb-5 flex items-center justify-center shadow-soft" style="background: linear-gradient(135deg, #7C7EE8, #A78BFA);">
      <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 4a2 2 0 0 0 2 2a2 2 0 0 0 -2 2a2 2 0 0 0 -2 -2a2 2 0 0 0 2 -2"/>
      </svg>
    </div>
    <h1 class="font-display text-2xl tracking-tight" style="color: var(--tw-color-ink)">AI 助手</h1>
    <p class="text-sm mt-1 tracking-wider" style="color: var(--tw-color-muted)">Intelligent Assistant</p>
  </div>

  <!-- Card -->
  <div class="bg-white/80 backdrop-blur-xl rounded-3xl border border-border/50 shadow-card p-8 card-animate">

    <!-- Tabs -->
    <div class="flex gap-6 mb-8 pb-3 border-b border-border/50">
      <button id="tab-login" class="text-sm font-medium pb-1 transition-all duration-200 border-b-2" onclick="switchTab('login')">登录</button>
      <button id="tab-register" class="text-sm font-medium pb-1 transition-all duration-200 border-b-2 border-transparent" style="color: var(--tw-color-muted)" onclick="switchTab('register')">注册</button>
    </div>

    <!-- Messages -->
    <div id="error" class="hidden mb-5 px-4 py-3 rounded-xl text-sm fade-in" style="background: #FEF2F2; color: #DC2626;"></div>
    <div id="success" class="hidden mb-5 px-4 py-3 rounded-xl text-sm fade-in" style="background: #ECFDF5; color: #059669;"></div>

    <!-- Login Form -->
    <form id="loginForm" autocomplete="off">
      <div class="space-y-5">
        <div>
          <label class="block text-xs font-semibold mb-2 uppercase tracking-wider" style="color: var(--tw-color-muted)">用户名</label>
          <input type="text" id="loginUser" placeholder="输入用户名" required
            class="w-full px-4 py-3.5 rounded-xl text-sm outline-none transition-all duration-200"
            style="background: var(--tw-color-paper); border: 1.5px solid transparent; color: var(--tw-color-ink);"
            onfocus="this.style.borderColor='#7C7EE8'; this.style.boxShadow='0 0 0 3px rgba(124, 126, 232, 0.15)';"
            onblur="this.style.borderColor='transparent'; this.style.boxShadow='none';">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-2 uppercase tracking-wider" style="color: var(--tw-color-muted)">密码</label>
          <input type="password" id="loginPass" placeholder="输入密码" required
            class="w-full px-4 py-3.5 rounded-xl text-sm outline-none transition-all duration-200"
            style="background: var(--tw-color-paper); border: 1.5px solid transparent; color: var(--tw-color-ink);"
            onfocus="this.style.borderColor='#7C7EE8'; this.style.boxShadow='0 0 0 3px rgba(124, 126, 232, 0.15)';"
            onblur="this.style.borderColor='transparent'; this.style.boxShadow='none';">
        </div>
      </div>
      <button type="submit" id="loginBtn"
        class="w-full mt-7 py-3.5 text-sm font-semibold rounded-xl text-white transition-all duration-200 hover:shadow-lg active:scale-[0.98]"
        style="background: linear-gradient(135deg, #7C7EE8, #A78BFA);">
        登 录
      </button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="hidden" autocomplete="off">
      <div class="space-y-5">
        <div>
          <label class="block text-xs font-semibold mb-2 uppercase tracking-wider" style="color: var(--tw-color-muted)">用户名</label>
          <input type="text" id="regUser" placeholder="至少 2 个字符" required minlength="2"
            class="w-full px-4 py-3.5 rounded-xl text-sm outline-none transition-all duration-200"
            style="background: var(--tw-color-paper); border: 1.5px solid transparent; color: var(--tw-color-ink);"
            onfocus="this.style.borderColor='#7C7EE8'; this.style.boxShadow='0 0 0 3px rgba(124, 126, 232, 0.15)';"
            onblur="this.style.borderColor='transparent'; this.style.boxShadow='none';">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-2 uppercase tracking-wider" style="color: var(--tw-color-muted)">密码</label>
          <input type="password" id="regPass" placeholder="至少 4 个字符" required minlength="4"
            class="w-full px-4 py-3.5 rounded-xl text-sm outline-none transition-all duration-200"
            style="background: var(--tw-color-paper); border: 1.5px solid transparent; color: var(--tw-color-ink);"
            onfocus="this.style.borderColor='#7C7EE8'; this.style.boxShadow='0 0 0 3px rgba(124, 126, 232, 0.15)';"
            onblur="this.style.borderColor='transparent'; this.style.boxShadow='none';">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-2 uppercase tracking-wider" style="color: var(--tw-color-muted)">身份</label>
          <select id="regRole" onchange="toggleAdvisorField()"
            class="w-full px-4 py-3.5 rounded-xl text-sm outline-none transition-all duration-200 cursor-pointer appearance-none"
            style="background: var(--tw-color-paper); border: 1.5px solid transparent; color: var(--tw-color-ink);"
            onfocus="this.style.borderColor='#7C7EE8'; this.style.boxShadow='0 0 0 3px rgba(124, 126, 232, 0.15)';"
            onblur="this.style.borderColor='transparent'; this.style.boxShadow='none';">
            <option value="student">学生</option>
            <option value="employee">员工 / 老师</option>
          </select>
        </div>
        <div id="advisorField" class="hidden">
          <label class="block text-xs font-semibold mb-2 uppercase tracking-wider" style="color: var(--tw-color-muted)">班主任</label>
          <select id="regAdvisor"
            class="w-full px-4 py-3.5 rounded-xl text-sm outline-none transition-all duration-200 cursor-pointer appearance-none"
            style="background: var(--tw-color-paper); border: 1.5px solid transparent; color: var(--tw-color-ink);"
            onfocus="this.style.borderColor='#7C7EE8'; this.style.boxShadow='0 0 0 3px rgba(124, 126, 232, 0.15)';"
            onblur="this.style.borderColor='transparent'; this.style.boxShadow='none';">
            <option value="">请选择班主任</option>
          </select>
        </div>
      </div>
      <button type="submit" id="registerBtn"
        class="w-full mt-7 py-3.5 text-sm font-semibold rounded-xl text-white transition-all duration-200 hover:shadow-lg active:scale-[0.98]"
        style="background: linear-gradient(135deg, #7C7EE8, #A78BFA);">
        注 册
      </button>
    </form>

    <!-- Guest Link -->
    <div class="mt-8 pt-6 border-t border-border/50 text-center">
      <a href="/" class="text-sm transition-colors duration-200 hover:opacity-80" style="color: var(--tw-color-muted)">
        免登录体验游客模式 →
      </a>
    </div>
  </div>
</div>

<script>
const THEMES = {
  student: { bg: 'linear-gradient(135deg, #7C7EE8, #A78BFA)', color: '#7C7EE8' },
  employee: { bg: 'linear-gradient(135deg, #3DB89C, #5DD3B3)', color: '#3DB89C' },
  guest: { bg: 'linear-gradient(135deg, #E8885E, #F0A876)', color: '#E8885E' },
};

const role = localStorage.getItem('role') || 'student';
const theme = THEMES[role] || THEMES.student;

document.getElementById('logo-icon').style.background = theme.bg;

let currentTab = 'login';
let employees = [];

async function loadEmployees() {
  const select = document.getElementById('regAdvisor');
  if (select) {
    select.innerHTML = '<option value="">加载中...</option>';
    select.disabled = true;
  }
  try {
    const resp = await fetch('/api/employees');
    if (!resp.ok) throw new Error('Failed to load');
    const data = await resp.json();
    employees = data.employees || [];
    populateAdvisorDropdown();
  } catch (e) {
    console.error('Failed to load employees', e);
    if (select) {
      select.innerHTML = '<option value="">加载失败</option>';
      select.disabled = false;
    }
    showErr('加载班主任列表失败，请刷新重试');
  }
}

function populateAdvisorDropdown() {
  const select = document.getElementById('regAdvisor');
  if (!select) return;
  select.disabled = false;
  select.innerHTML = '<option value="">请选择班主任</option>';
  if (employees.length === 0) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '暂无员工可选择';
    select.appendChild(opt);
  }
  employees.forEach(emp => {
    const opt = document.createElement('option');
    opt.value = emp.id;
    opt.textContent = emp.username;
    select.appendChild(opt);
  });
}

function toggleAdvisorField() {
  const roleVal = document.getElementById('regRole')?.value;
  const advisorField = document.getElementById('advisorField');
  if (!advisorField) return;
  if (roleVal === 'student') {
    advisorField.classList.remove('hidden');
  } else {
    advisorField.classList.add('hidden');
    const select = document.getElementById('regAdvisor');
    if (select) select.value = '';
  }
}

function switchTab(tab) {
  currentTab = tab;
  const loginTab = document.getElementById('tab-login');
  const registerTab = document.getElementById('tab-register');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');

  if (tab === 'login') {
    loginTab.style.borderColor = theme.color;
    loginTab.style.color = theme.color;
    registerTab.style.borderColor = 'transparent';
    registerTab.style.color = '';
  } else {
    registerTab.style.borderColor = theme.color;
    registerTab.style.color = theme.color;
    loginTab.style.borderColor = 'transparent';
    loginTab.style.color = '';
  }

  loginForm.classList.toggle('hidden', tab !== 'login');
  registerForm.classList.toggle('hidden', tab !== 'register');
  hideMessages();
  if (tab === 'register') {
    loadEmployees().then(() => toggleAdvisorField());
  }
}

function showErr(msg) {
  const e = document.getElementById('error');
  e.textContent = msg;
  e.classList.remove('hidden');
  document.getElementById('success').classList.add('hidden');
}

function showOk(msg) {
  const s = document.getElementById('success');
  s.textContent = msg;
  s.classList.remove('hidden');
  document.getElementById('error').classList.add('hidden');
}

function hideMessages() {
  document.getElementById('error').classList.add('hidden');
  document.getElementById('success').classList.add('hidden');
}

document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  hideMessages();
  const btn = document.getElementById('loginBtn');
  btn.textContent = '登录中...';
  btn.disabled = true;
  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('loginUser').value,
        password: document.getElementById('loginPass').value
      })
    });
    const data = await resp.json();
    if (!resp.ok) {
      showErr(data.detail || '登录失败');
      btn.textContent = '登录';
      btn.disabled = false;
      return;
    }
    localStorage.setItem('token', data.token);
    localStorage.setItem('role', data.role);
    window.location.href = '/';
  } catch {
    showErr('网络错误，请重试');
    btn.textContent = '登录';
    btn.disabled = false;
  }
};

document.getElementById('registerForm').onsubmit = async (e) => {
  e.preventDefault();
  hideMessages();
  const btn = document.getElementById('registerBtn');
  btn.textContent = '注册中...';
  btn.disabled = true;
  const roleVal = document.getElementById('regRole').value;
  const advisor = document.getElementById('regAdvisor').value;
  if (roleVal === 'student' && !advisor) {
    showErr('请选择班主任');
    btn.textContent = '注册';
    btn.disabled = false;
    return;
  }
  try {
    const regBody = {
      username: document.getElementById('regUser').value,
      password: document.getElementById('regPass').value,
      role: roleVal
    };
    if (regBody.role === 'student') {
      const advisorVal = document.getElementById('regAdvisor')?.value;
      if (advisorVal) {
        regBody.class_advisor_id = parseInt(advisorVal);
      }
    }
    const resp = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(regBody)
    });
    const data = await resp.json();
    if (!resp.ok) {
      showErr(data.detail || '注册失败');
      btn.textContent = '注册';
      btn.disabled = false;
      return;
    }
    showOk('注册成功！请切换到登录页面');
    document.getElementById('regUser').value = '';
    document.getElementById('regPass').value = '';
    btn.textContent = '注册';
    btn.disabled = false;
  } catch {
    showErr('网络错误，请重试');
    btn.textContent = '注册';
    btn.disabled = false;
  }
};
</script>
</body>
</html>
