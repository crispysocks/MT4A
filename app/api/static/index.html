<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mt4a // Neural Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --accent-cyan: #00f0ff;
            --accent-magenta: #ff00aa;
            --accent-green: #00ff88;
            --text-primary: #e0e0e8;
            --text-secondary: #8888a0;
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.4);
            --glow-magenta: 0 0 20px rgba(255, 0, 170, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* Noise texture overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.015;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            position: relative;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--accent-cyan);
            border-radius: 8px;
            transform: rotate(45deg);
            animation: logo-pulse 3s ease-in-out infinite;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: var(--glow-cyan);
        }

        @keyframes logo-pulse {
            0%, 100% { opacity: 1; transform: rotate(45deg) scale(1); }
            50% { opacity: 0.6; transform: rotate(45deg) scale(0.95); }
        }

        .logo h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: status-blink 2s ease-in-out infinite;
        }

        @keyframes status-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Chat area */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        #chat::-webkit-scrollbar {
            width: 6px;
        }

        #chat::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        #chat::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
            border-radius: 3px;
        }

        .message {
            display: flex;
            gap: 14px;
            opacity: 0;
            transform: translateY(20px);
            animation: message-in 0.5s ease-out forwards;
        }

        @keyframes message-in {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--accent-cyan), #0088aa);
            box-shadow: var(--glow-cyan);
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, var(--accent-magenta), #aa0066);
            box-shadow: var(--glow-magenta);
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 6px;
        }

        .message-role {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .message.user .message-role {
            color: var(--accent-cyan);
        }

        .message.assistant .message-role {
            color: var(--accent-magenta);
        }

        .message-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .message-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            animation: typing-bounce 1.4s ease-in-out infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing-bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Input area */
        .input-area {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 240, 255, 0.15);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: var(--bg-secondary);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 6px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
        }

        #input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            color: var(--text-primary);
            padding: 12px 8px;
        }

        #input::placeholder {
            color: var(--text-secondary);
        }

        button {
            background: linear-gradient(135deg, var(--accent-cyan), #00a0aa);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--bg-primary);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-cyan);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Welcome message */
        .welcome {
            text-align: center;
            padding: 60px 20px;
            animation: welcome-in 0.8s ease-out;
        }

        @keyframes welcome-in {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome h2 {
            font-size: 2rem;
            margin-bottom: 16px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome p {
            color: var(--text-secondary);
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .welcome-features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .welcome-feature {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .welcome-feature span {
            color: var(--accent-cyan);
        }

        /* Error message */
        .error-message {
            background: rgba(255, 0, 100, 0.1);
            border: 1px solid rgba(255, 0, 100, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            color: #ff6688;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>MT4A</h1>
            </div>
            <div class="status">
                <div class="status-dot"></div>
                <span>ONLINE</span>
            </div>
        </header>

        <div id="chat">
            <div class="welcome">
                <h2>Neural Agent Ready</h2>
                <p>Your AI coding assistant powered by advanced language models. Ready to help with code, files, and knowledge.</p>
                <div class="welcome-features">
                    <div class="welcome-feature"><span>></span> Code Analysis</div>
                    <div class="welcome-feature"><span>></span> File Operations</div>
                    <div class="welcome-feature"><span>></span> Knowledge Search</div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="input" placeholder="Ask me anything..." autocomplete="off" />
                <button id="sendBtn" onclick="send()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');

        let isStreaming = false;

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        function addMessage(role, content) {
            const welcome = chatDiv.querySelector('.welcome');
            if (welcome) welcome.remove();

            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            const avatar = role === 'user' ? '>' : '◈';

            const message = document.createElement('div');
            message.className = `message ${role}`;
            message.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-role">${role === 'user' ? 'You' : 'Agent'}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-text">${escapeHtml(content)}</div>
                </div>
            `;
            chatDiv.appendChild(message);
            chatDiv.scrollTop = chatDiv.scrollHeight;
            return message;
        }

        function addTypingIndicator() {
            const typing = document.createElement('div');
            typing.className = 'message assistant typing';
            typing.id = 'typing';
            typing.innerHTML = `
                <div class="message-avatar">◈</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dots">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            `;
            chatDiv.appendChild(typing);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        function removeTypingIndicator() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function send() {
            const message = input.value.trim();
            if (!message || isStreaming) return;

            isStreaming = true;
            sendBtn.disabled = true;
            input.value = '';

            addMessage('user', message);
            addTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: [{ role: 'user', content: message }] })
                });

                removeTypingIndicator();

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                const assistantMsg = addMessage('assistant', '');
                const textDiv = assistantMsg.querySelector('.message-text');
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    for (const line of chunk.split('\n')) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.type === 'content' && data.content) {
                                    fullContent += data.content;
                                    textDiv.textContent = fullContent;
                                    chatDiv.scrollTop = chatDiv.scrollHeight;
                                } else if (data.type === 'error') {
                                    throw new Error(data.content);
                                }
                            } catch (e) {}
                        }
                    }
                }

                if (!fullContent) {
                    textDiv.textContent = '(No response received)';
                }
            } catch (e) {
                removeTypingIndicator();
                const errorMsg = document.createElement('div');
                errorMsg.className = 'error-message';
                errorMsg.textContent = `Error: ${e.message}`;
                chatDiv.appendChild(errorMsg);
            }

            isStreaming = false;
            sendBtn.disabled = false;
            input.focus();
        }
    </script>
</body>
</html>
