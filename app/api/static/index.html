<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寰宇留学 · 智能助手</title>
<style>
:root {
    --font-display: Georgia, "Times New Roman", "Noto Serif SC", serif;
    --font-body: "Segoe UI", system-ui, -apple-system, sans-serif;
    --sidebar-bg: #1a1a2e;
    --sidebar-text: #a5a5c0;
    --sidebar-hover: #252542;
    --sidebar-active: #2d2d5e;
    --bg: #faf9f6;
    --surface: #ffffff;
    --text: #1c1c2e;
    --text-muted: #78716c;
    --border: #e8e6e1;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,0.03), 0 4px 16px rgba(0,0,0,0.05);
    --accent: #1e3a8a;
    --accent-user: #dbeafe;
    --accent-assistant: #f5f5f4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: var(--font-body);
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
}

/* ── Topbar ── */
#topbar {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    color: #fff;
    font-size: 14px;
    flex-shrink: 0;
    z-index: 10;
    position: relative;
    transition: background 0.4s;
}
#topbar::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 100%);
    pointer-events: none;
}
.topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
}
.topbar-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
    box-shadow: 0 0 8px rgba(255,255,255,0.3);
    animation: dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
}
.role-label {
    font-weight: 600;
    letter-spacing: 0.5px;
    font-size: 14px;
}
#logout-btn {
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.9);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 5px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.3px;
    transition: background 0.2s, border-color 0.2s;
    font-family: var(--font-body);
}
#logout-btn:hover {
    background: rgba(255,255,255,0.2);
    border-color: rgba(255,255,255,0.3);
}

/* ── Guest Banner ── */
#guest-banner {
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    color: #78350f;
    padding: 8px 20px;
    text-align: center;
    font-size: 13px;
    flex-shrink: 0;
    font-weight: 500;
    letter-spacing: 0.3px;
    display: none;
}
#guest-banner a {
    color: #1e3a8a;
    font-weight: 600;
    text-decoration: none;
    margin-left: 4px;
    border-bottom: 1px dashed #1e3a8a;
}

/* ── Layout ── */
#app {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
}

/* ── Sidebar ── */
#sidebar {
    width: 270px;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    border-right: 1px solid rgba(255,255,255,0.05);
}
#sidebar-header {
    padding: 16px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
}
#sidebar-header .logo {
    font-family: var(--font-display);
    font-size: 16px;
    color: #e0e0f0;
    letter-spacing: 0.5px;
}
#new-chat-btn {
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: var(--sidebar-text);
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
}
#new-chat-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

#session-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
}
#session-list::-webkit-scrollbar { width: 4px; }
#session-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

.session-item {
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    color: var(--sidebar-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.15s, color 0.15s;
    font-weight: 450;
    letter-spacing: 0.2px;
}
.session-item:hover { background: var(--sidebar-hover); color: #d0d0e8; }
.session-item.active {
    background: var(--sidebar-active);
    color: #fff;
    font-weight: 500;
}
.empty-state {
    text-align: center;
    color: rgba(255,255,255,0.2);
    padding: 30px 20px;
    font-size: 13px;
    font-style: italic;
}

/* ── Main Chat Area ── */
#main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scroll-behavior: smooth;
}
#chat::-webkit-scrollbar { width: 5px; }
#chat::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 5px; }

/* ── Messages ── */
.message {
    max-width: 70%;
    padding: 14px 18px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    animation: msgAppear 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
    position: relative;
}

@keyframes msgAppear {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

.message .role-tag {
    font-weight: 650;
    margin-bottom: 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.5;
}

.message.user {
    align-self: flex-end;
    background: var(--accent-user);
    border-bottom-right-radius: 4px;
    color: #1e293b;
}
.message.assistant {
    align-self: flex-start;
    background: var(--surface);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    color: var(--text);
}

/* ── Loading ── */
.loading-indicator {
    display: flex;
    gap: 5px;
    padding: 6px 0;
    align-items: center;
}
.loading-indicator span {
    width: 7px; height: 7px;
    background: #94a3b8;
    border-radius: 50%;
    animation: ld 1.4s infinite ease-in-out both;
}
.loading-indicator span:nth-child(1) { animation-delay: -0.32s; }
.loading-indicator span:nth-child(2) { animation-delay: -0.16s; }
@keyframes ld {
    0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
}

/* ── Empty State ── */
#chat-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-muted);
    opacity: 0.6;
}
#chat-empty .icon {
    width: 56px; height: 56px;
    border-radius: 20px;
    background: linear-gradient(135deg, #e8e6e1, #d6d3d1);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
}
#chat-empty .icon svg { width: 24px; height: 24px; stroke: #78716c; fill: none; stroke-width: 1.5; }
#chat-empty .title {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--text-muted);
}
#chat-empty .hint {
    font-size: 13px;
    letter-spacing: 0.3px;
}

/* ── Input ── */
#input-container {
    padding: 14px 20px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: flex-end;
}
#input {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: var(--font-body);
    color: var(--text);
    background: #fafaf9;
    outline: none;
    resize: none;
    max-height: 120px;
    transition: border-color 0.2s, box-shadow 0.2s;
    line-height: 1.5;
}
#input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(30,58,138,0.07);
    background: var(--surface);
}
#send {
    padding: 12px 22px;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #fff;
    transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
    font-family: var(--font-body);
    white-space: nowrap;
}
#send:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
#send:active { transform: scale(0.97); }
#send:disabled { opacity: 0.5; cursor: not-allowed; }

@media (max-width: 768px) {
    #sidebar { width: 220px; font-size: 12px; }
    .message { max-width: 85%; }
}
</style>
</head>
<body>

<!-- Topbar -->
<div id="topbar">
    <div class="topbar-left">
        <div class="topbar-dot"></div>
        <span class="role-label" id="role-label">加载中...</span>
    </div>
    <button id="logout-btn" onclick="logout()">登出</button>
</div>

<!-- Guest Banner -->
<div id="guest-banner">游客模式 · <a href="/login">登录享受更多功能</a></div>

<!-- App body -->
<div id="app">
    <!-- Sidebar -->
    <div id="sidebar">
        <div id="sidebar-header">
            <span class="logo">寰宇留学</span>
            <button id="new-chat-btn" title="新建对话">+</button>
        </div>
        <div id="session-list"></div>
    </div>

    <!-- Main chat area -->
    <div id="main">
        <div id="chat">
            <div id="chat-empty">
                <div class="icon">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/><circle cx="12" cy="12" r="8" opacity="0.5"/></svg>
                </div>
                <div class="title">开始新对话</div>
                <div class="hint">输入消息，智能助手即刻响应</div>
            </div>
        </div>
        <div id="input-container">
            <textarea id="input" rows="1" placeholder="输入您的消息..."></textarea>
            <button id="send">发送</button>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
